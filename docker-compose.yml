
services:
  postgres:
    image: postgres:16-alpine
    container_name: seat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat_dev_password
      POSTGRES_DB: seat_db
    ports:
      - "5432:5432"
    volumes:
      - seat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - seat_redis:/data

  backend:
    build: ./backend
    container_name: seat_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://seat:seat_dev_password@postgres:5432/seat_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev_jwt_secret_change_me_in_production
      ENVIRONMENT: development
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: seat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  seat_pgdata:
  seat_redis:
